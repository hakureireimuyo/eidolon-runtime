[project]
name = "eidolon-runtime"
version = "0.1.0"
description = "Eidolon 运行时组合层 —— Web 服务 + UI + Extension Registry + Context Compiler"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "openai>=1.30",
    "pillow>=10.0",
    "eidolon-character",
    "eidolon-character-service",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["runtime*", "backend*"]

[tool.uv.sources]
eidolon-character = { workspace = true }
eidolon-character-service = { workspace = true }
