[project]
name = "eidolon-runtime"
version = "0.1.0"
description = "Eidolon 运行时组合层 —— Web 服务 + UI + Extension Registry + Context Compiler"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "openai>=1.30",
    "pillow>=10.0",
    "eidolon-character-service",
]

[project.optional-dependencies]
# 生产代码只消费解释器(eidolon-character-service);格式层(eidolon-character)
# 仅测试夹具构造时直接使用,故放在 dev。
dev = ["pytest", "eidolon-character"]

[tool.setuptools.packages.find]
include = ["runtime*", "backend*"]

[tool.uv.sources]
eidolon-character = { workspace = true }
eidolon-character-service = { workspace = true }
