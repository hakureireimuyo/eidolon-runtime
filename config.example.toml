# Eidolon Runtime 配置示例(复制为 config.toml 后填写,config.toml 已被 gitignore)
#
# 开发者工具开关(环境变量;开启后提供 /devtools 页面,状态仅存内存不落盘)。
# scripts/start.sh 默认开启,如直接以其他方式启动或需关闭:
#   PowerShell:  $env:EIDOLON_RUNTIME_DEVTOOLS = "1"
#   Bash:        export EIDOLON_RUNTIME_DEVTOOLS=1

[llm]
# 选用的服务(工厂注册键,当前仅 deepseek)
provider = "deepseek"

# DeepSeek API Key(必填才能真实对话)
api_key = "sk-xxxx"

# DeepSeek 兼容端点
base_url = "https://api.deepseek.com/v1"

# 模型名
model = "deepseek-chat"

# 创造性(0~1+)
temperature = 0.8

# 回复长度上限
max_tokens = 1024
