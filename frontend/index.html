<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eidolon Runtime</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #9aa3b2;
    --accent: #6ea8fe;
    --accent-2: #3b82f6;
    --user: #2563eb;
    --bot: #1f232c;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .tag { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  button, .filebtn {
    background: var(--accent-2); color: #fff; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; cursor: pointer; transition: filter .15s;
  }
  button:hover, .filebtn:hover { filter: brightness(1.1); }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input[type="file"] { display: none; }

  main { flex: 1; display: flex; min-height: 0; }

  /* ---- 左侧角色列表(可收起) ---- */
  #sidebar {
    width: 264px; border-right: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; transition: width .2s; flex-shrink: 0;
  }
  #sidebar.collapsed { width: 70px; }
  .side-head {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 10px 10px 6px; min-height: 46px;
  }
  .side-toggle { background: transparent; border: none; color: var(--muted); font-size: 15px; padding: 6px 10px; }
  .side-toggle:hover { color: var(--text); background: var(--panel-2); }
  .char-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; display: flex; flex-direction: column; gap: 4px; }
  .char-item {
    display: flex; align-items: center; gap: 10px; padding: 8px;
    border-radius: 10px; cursor: pointer; border: 1px solid transparent;
    transition: background .12s; overflow: hidden;
  }
  .char-item:hover { background: var(--panel-2); }
  .char-item.active { background: var(--panel-2); border-color: var(--accent-2); }
  .char-item .item-meta { min-width: 0; }
  .char-item .item-meta b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .char-item .item-meta i { font-style: normal; font-size: 11px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sidebar.collapsed .char-item { justify-content: center; padding: 6px; }
  #sidebar.collapsed .item-meta { display: none; }
  .side-empty { color: var(--muted); font-size: 12px; text-align: center; margin-top: 40px; padding: 0 12px; line-height: 1.6; }
  #sidebar.collapsed .side-empty { display: none; }

  /* ---- 右侧聊天 ---- */
  .chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .chat-head-name { font-size: 14px; font-weight: 600; }
  .chat-head-name.empty { color: var(--muted); font-weight: 400; }

  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg-row { display: flex; align-items: flex-end; gap: 10px; }
  .msg-row.user { justify-content: flex-end; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: transparent; color: var(--muted); font-size: 12px; border: none; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); background: var(--panel-2); flex-shrink: 0; }
  .avatar-fallback { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; }
  .char-item .avatar { width: 40px; height: 40px; }

  .composer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); background: var(--panel); }
  .composer textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px;
    font-family: inherit; max-height: 140px;
  }
  .composer textarea:focus { outline: none; border-color: var(--accent); }
  .notice { padding: 8px 18px; font-size: 12px; color: var(--danger); background: #2a1416; border-bottom: 1px solid var(--border); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- 角色卡悬浮面板(居中,只读展示) ---- */
  .card-modal { width: 460px; max-width: 92vw; padding: 0; display: flex; flex-direction: column; max-height: 84vh; overflow: hidden; }
  .card-modal .modal-head { margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  /* 面板内不显示滚动条(滚轮仍可滚动) */
  .card-body { flex: 1; overflow-y: auto; scrollbar-width: none; }
  .card-body::-webkit-scrollbar { display: none; }

  .card-banner { position: relative; height: 260px; background: var(--panel-2); border-bottom: 1px solid var(--border); }
  .card-banner img { width: 100%; height: 100%; object-fit: cover; }
  .card-banner .name-overlay {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 18px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,.78));
  }
  .card-banner .name-overlay h2 { margin: 0 0 4px; font-size: 20px; }
  .card-banner .name-overlay .sub { color: #cfd6e0; font-size: 12px; }
  /* 无封面时的纯文字标题块 */
  .card-title { padding: 18px; border-bottom: 1px solid var(--border); }
  .card-title h2 { margin: 0 0 4px; font-size: 20px; }
  .card-title .sub { color: var(--muted); font-size: 12px; }
  .card-sec { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .card-sec .k { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 8px; }
  .card-sec .v { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
  .chip.hl { color: var(--accent); border-color: rgba(110,168,254,.4); }
  .ex { margin-bottom: 10px; }
  .ex:last-child { margin-bottom: 0; }
  .ex .u { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .ex .a { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
  .asset-line { font-size: 12px; color: var(--muted); padding: 4px 0; }
  .asset-line .purpose { color: var(--accent); margin-right: 6px; }

  /* ---- 设置弹窗 ---- */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; width: 430px; max-width: 92vw; padding: 18px 20px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .modal-head h3 { margin: 0; font-size: 15px; }
  .modal-head button { background: transparent; border: none; color: var(--muted); font-size: 18px; padding: 0 6px; cursor: pointer; }
  .lbl { display: block; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .lbl input { width: 100%; margin-top: 4px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .lbl input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
  .row .lbl { flex: 1; }
  .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .msg-inline { color: var(--accent); font-size: 12px; margin-right: auto; }
</style>
</head>
<body>
<header>
  <h1>Eidolon Runtime</h1>
  <span class="tag">运行时层 · 多角色对话</span>
  <span class="spacer"></span>
  <label class="filebtn">加载角色卡
    <input type="file" id="fileInput" accept=".cart,.png,.zip" />
  </label>
  <button class="ghost" id="settingsBtn">设置</button>
  <button class="ghost" id="resetBtn">清空对话</button>
  <button class="ghost" id="devtoolsBtn" style="display:none">开发者工具</button>
</header>

<div id="notice" class="notice" style="display:none"></div>

<main>
  <aside id="sidebar">
    <div class="side-head">
      <button class="side-toggle" id="sideToggle" title="收起 / 展开角色列表">◀</button>
    </div>
    <div class="char-list" id="charList"></div>
  </aside>

  <section class="chat-panel">
    <div class="chat-head">
      <span class="chat-head-name" id="headName">尚未加载角色。</span>
    </div>
    <div class="messages" id="messages">
      <div class="msg sys">等待加载角色卡……</div>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="加载角色后在此输入消息…" disabled></textarea>
      <button id="sendBtn" disabled>发送</button>
    </div>
  </section>
</main>

<!-- 角色卡悬浮面板(居中,只读展示) -->
<div id="cardModal" class="modal" style="display:none">
  <div class="modal-box card-modal">
    <div class="modal-head">
      <h3>角色卡</h3>
    </div>
    <div class="card-body" id="cardBody"></div>
  </div>
</div>

<div id="settingsModal" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <h3>AI 服务设置</h3>
      <button id="settingsClose">✕</button>
    </div>
    <label class="lbl">服务 (provider)
      <input id="setProvider" value="deepseek" /></label>
    <label class="lbl">API Key
      <input id="setApiKey" type="password" placeholder="sk-..." autocomplete="off" /></label>
    <label class="lbl">Base URL
      <input id="setBaseUrl" placeholder="https://api.deepseek.com/v1" /></label>
    <label class="lbl">模型 (model)
      <input id="setModel" placeholder="deepseek-chat" /></label>
    <div class="row">
      <label class="lbl">温度
        <input id="setTemp" type="number" step="0.1" min="0" max="2" value="0.8" /></label>
      <label class="lbl">最大 Token
        <input id="setMax" type="number" step="1" min="1" value="1024" /></label>
    </div>
    <div class="modal-foot">
      <span id="settingsMsg" class="msg-inline"></span>
      <button id="settingsSave">保存</button>
    </div>
  </div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
const messagesEl = $("#messages");
const inputEl = $("#input");
const sendBtn = $("#sendBtn");
const noticeEl = $("#notice");

// 当前角色(渲染消息头像 / 头部 / 角色卡用)
let characterInfo = null;
let characterName = "";
let characterAvatar = null; // data URI,直接来自角色服务的内存实例

function notice(msg) {
  if (!msg) { noticeEl.style.display = "none"; return; }
  noticeEl.textContent = msg;
  noticeEl.style.display = "block";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const USER_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#3a4250" stroke="#9aa3b2" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.9 3.6-6.2 8-6.2s8 2.3 8 6.2"/></svg>'
);

// 头像元素:有图出 img,无图用名字首字占位(保持布局稳定)
function avatarHtml(src, name) {
  if (src) return `<img class="avatar" src="${escapeHtml(src)}" alt="${escapeHtml(name || "头像")}" />`;
  return `<div class="avatar avatar-fallback">${escapeHtml((name || "?").trim().charAt(0) || "?")}</div>`;
}

// 聊天头像:直接消费 /api/character 中由角色服务内存实例直出的资产字节
// (image/* 附 base64 data URI),优先 purpose=avatar,依次回退 portrait / cover;
// 无 data 时退回 /api/asset/{id} 兜底。
function pickChatAvatar(info) {
  if (!info.assets || !info.assets.length) return null;
  const order = ["avatar", "portrait", "cover"];
  let chosen = null;
  for (const p of order) {
    chosen = info.assets.find((a) => (a.purpose || "").toLowerCase() === p);
    if (chosen) break;
  }
  if (!chosen) chosen = info.assets.find((a) => (a.type || "").startsWith("image/"));
  if (!chosen) return null;
  return chosen.data || `/api/asset/${encodeURIComponent(chosen.id)}`;
}

// 角色卡横幅:仅 purpose=cover 的封面图,其余图片资源一律只出文字
function pickCover(info) {
  if (!info.assets || !info.assets.length) return null;
  const chosen = info.assets.find((a) => (a.purpose || "").toLowerCase() === "cover");
  if (!chosen) return null;
  return chosen.data || `/api/asset/${encodeURIComponent(chosen.id)}`;
}

function botAvatar() {
  return avatarHtml(characterAvatar, characterName);
}

function userAvatar() {
  return `<img class="avatar" src="${USER_AVATAR}" alt="我" />`;
}

function addMessage(role, text) {
  if (role !== "user" && role !== "bot") {
    const div = document.createElement("div");
    div.className = "msg sys";
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return;
  }
  const row = document.createElement("div");
  row.className = "msg-row " + role;
  // 角色行头像在气泡左侧;用户行头像在右侧
  row.innerHTML = role === "user"
    ? `<div class="msg user"></div>${userAvatar()}`
    : `${botAvatar()}<div class="msg bot"></div>`;
  row.querySelector(".msg").textContent = text;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addTyping() {
  const row = document.createElement("div");
  row.className = "msg-row bot";
  row.innerHTML = `${botAvatar()}<div class="msg bot"><span class="spinner"></span></div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

// ---- 左侧角色列表 ----

function renderList(chars) {
  const listEl = $("#charList");
  if (!chars || !chars.length) {
    listEl.innerHTML = '<div class="side-empty">尚未加载角色。<br/>点击右上角「加载角色卡」。</div>';
    return;
  }
  listEl.innerHTML = chars.map((c) => `
    <div class="char-item${c.active ? " active" : ""}" data-key="${escapeHtml(c.key)}" title="${escapeHtml(c.name)}">
      ${avatarHtml(c.avatar, c.name)}
      <span class="item-meta">
        <b>${escapeHtml(c.name)}</b>${c.nickname ? `<i>${escapeHtml(c.nickname)}</i>` : ""}
      </span>
    </div>`).join("");
}

async function refreshList() {
  try {
    const res = await fetch("/api/characters");
    const data = await res.json();
    renderList(data.characters || []);
  } catch (e) {
    notice("获取角色列表失败:" + e.message);
  }
}

$("#charList").addEventListener("click", (e) => {
  const item = e.target.closest(".char-item");
  if (!item || item.classList.contains("active")) return;
  selectCharacter(item.dataset.key);
});

async function selectCharacter(key) {
  try {
    const res = await fetch("/api/select", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key }),
    });
    if (!res.ok) { const d = await res.json(); notice("切换失败:" + (d.detail || res.status)); return; }
    await refreshList();
    await refreshChat();
  } catch (e) {
    notice("切换失败:" + e.message);
  }
}

// ---- 聊天区 ----

// 聊天头部只显示名字(状态信息后续在此扩展)
function renderHead(info) {
  const name = $("#headName");
  if (!info || !info.loaded) {
    name.textContent = "尚未加载角色。";
    name.classList.add("empty");
    return;
  }
  name.textContent = info.name;
  name.classList.remove("empty");
}

function renderMessages(info) {
  messagesEl.innerHTML = "";
  const history = info.history || [];
  if (history.length) {
    for (const m of history) {
      addMessage(m.role === "user" ? "user" : "bot", m.content);
    }
    return;
  }
  if (info.greeting) addMessage("bot", info.greeting);
  else addMessage("sys", `已加载角色「${info.name}」。开始对话吧。`);
}

async function refreshChat() {
  try {
    const res = await fetch("/api/character");
    const info = await res.json();
    characterInfo = info;
    if (info && info.loaded) {
      characterName = info.name || "";
      characterAvatar = pickChatAvatar(info);
      inputEl.disabled = false; sendBtn.disabled = false;
    } else {
      characterName = ""; characterAvatar = null; characterInfo = null;
      inputEl.disabled = true; sendBtn.disabled = true;
    }
    renderHead(info);
    if (info && info.loaded) renderMessages(info);
    else messagesEl.innerHTML = '<div class="msg sys">等待加载角色卡……</div>';
  } catch (e) {
    notice("获取角色信息失败:" + e.message);
  }
}

$("#fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  notice("");
  addMessage("sys", `正在加载 ${file.name} …`);
  try {
    const fd = new FormData();
    fd.append("file", file);
    const res = await fetch("/api/load", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) { notice("加载失败:" + (data.detail || res.status)); return; }
    await refreshList();
    await refreshChat();
  } catch (err) {
    notice("加载失败:" + err.message);
  } finally {
    e.target.value = "";
  }
});

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage("user", text);
  inputEl.value = "";
  sendBtn.disabled = true;
  const think = addTyping();
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    if (!res.ok) { notice("对话失败:" + (data.detail || res.status)); think.remove(); return; }
    think.remove();
    addMessage("bot", data.reply);
  } catch (err) {
    think.remove();
    notice("对话失败:" + err.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

$("#resetBtn").addEventListener("click", async () => {
  await fetch("/api/reset", { method: "POST" });
  await refreshChat();
});

// ---- 角色卡抽屉(只读) ----

function cardSec(k, inner) {
  return `<div class="card-sec"><div class="k">${escapeHtml(k)}</div>${inner}</div>`;
}

function chipsHtml(arr, hl) {
  if (!arr || !arr.length) return "";
  const items = arr.map((x) => `<span class="chip${hl ? " hl" : ""}">${escapeHtml(x)}</span>`).join("");
  return `<div class="chips">${items}</div>`;
}

function renderCardInfo(info) {
  const cover = pickCover(info);
  const idParts = [];
  if (info.gender) idParts.push(info.gender);
  if (info.age != null) idParts.push(info.age + " 岁");
  if (info.species) idParts.push(info.species);
  if (info.nickname) idParts.push("昵称 " + info.nickname);
  const nameBlock = `<h2>${escapeHtml(info.name)}</h2><div class="sub">${escapeHtml(idParts.join(" · ") || "—")}</div>`;
  const headHtml = cover
    ? `<div class="card-banner">
         <img src="${escapeHtml(cover)}" alt="cover" />
         <div class="name-overlay">${nameBlock}</div>
       </div>`
    : `<div class="card-title">${nameBlock}</div>`;

  const bg = info.background || {};
  const app = info.appearance || {};
  const per = info.personality || {};
  const dia = info.dialogue || {};

  const secs = [];
  secs.push(cardSec("背景", `<div class="v">${escapeHtml(bg.summary || "—")}</div>`));
  const occ = [bg.occupation, bg.location].filter(Boolean).join(" · ");
  if (occ) secs.push(cardSec("职业 / 所在地", `<div class="v">${escapeHtml(occ)}</div>`));
  secs.push(cardSec("外貌", `<div class="v">${escapeHtml(app.description || "—")}</div>` + chipsHtml(app.features)));
  secs.push(cardSec("性格", `<div class="v">${escapeHtml(per.description || "—")}</div>` + chipsHtml(per.traits, true)));
  if (per.values && per.values.length) secs.push(cardSec("价值观", chipsHtml(per.values)));
  if (dia.style) secs.push(cardSec("说话风格", `<div class="v">${escapeHtml(dia.style)}</div>`));
  if (dia.examples && dia.examples.length) {
    const ex = dia.examples.map((e) => `
      <div class="ex">
        <div class="u">${escapeHtml(info.name)} 说</div>
        <div class="a">${escapeHtml(e.assistant)}</div>
      </div>`).join("");
    secs.push(cardSec("对话示例", ex));
  }
  if (info.assets && info.assets.length) {
    // 除封面外所有资源一律只出文字(不显示缩略图)
    const inner = info.assets.map((a) => `
      <div class="asset-line"><span class="purpose">${escapeHtml(a.purpose || a.type || a.id)}</span>${escapeHtml(a.caption || a.id)}</div>`).join("");
    if (inner) secs.push(cardSec("资源", inner));
  }

  $("#cardBody").innerHTML = `
    ${headHtml}
    ${secs.join("")}`;
}

function openCard() {
  if (!characterInfo || !characterInfo.loaded) return;
  renderCardInfo(characterInfo);
  $("#cardModal").style.display = "flex";
}
function closeCard() {
  $("#cardModal").style.display = "none";
}

messagesEl.addEventListener("click", (e) => {
  if (e.target.closest(".msg-row.bot .avatar")) openCard();
});
$("#cardModal").addEventListener("click", (e) => { if (e.target === $("#cardModal")) closeCard(); });

$("#sideToggle").addEventListener("click", () => {

fetch("/api/meta")
  .then((r) => r.json())
  .then((m) => { if (m && m.devtools) $("#devtoolsBtn").style.display = ""; })

// ---- 设置弹窗 ----
const settingsModal = $("#settingsModal");
$("#settingsBtn").addEventListener("click", openSettings);
$("#settingsClose").addEventListener("click", () => settingsModal.style.display = "none");
settingsModal.addEventListener("click", (e) => { if (e.target === settingsModal) settingsModal.style.display = "none"; });

async function openSettings() {
  try {
    const r = await fetch("/api/settings");
    const s = await r.json();
    $("#setProvider").value = s.provider || "deepseek";
    $("#setApiKey").value = s.api_key || "";
    $("#setBaseUrl").value = s.base_url || "";
    $("#setModel").value = s.model || "";
    $("#setTemp").value = (s.temperature != null) ? s.temperature : 0.8;
    $("#setMax").value = (s.max_tokens != null) ? s.max_tokens : 1024;
    $("#settingsMsg").textContent = "";
    settingsModal.style.display = "flex";
  } catch (e) {
    notice("读取设置失败:" + e.message);
  }
}

$("#settingsSave").addEventListener("click", async () => {
  const body = {
    provider: $("#setProvider").value.trim(),
    api_key: $("#setApiKey").value,
    base_url: $("#setBaseUrl").value.trim(),
    model: $("#setModel").value.trim(),
    temperature: $("#setTemp").value,
    max_tokens: $("#setMax").value,
  };
  try {
    const r = await fetch("/api/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) { $("#settingsMsg").textContent = "保存失败:" + (d.detail || r.status); return; }
    $("#settingsMsg").textContent = "已保存 ✓";
    setTimeout(() => { settingsModal.style.display = "none"; }, 700);
  } catch (e) {
    $("#settingsMsg").textContent = "保存失败:" + e.message;
  }
});

refreshList();
refreshChat();
