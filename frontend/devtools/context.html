<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>上下文检查器 · Eidolon Runtime</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1f232c;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #9aa3b2;
    --accent: #6ea8fe;
    --accent-2: #3b82f6;
    /* devtools 专属 token */
    --ok: #22c55e;
    --warn: #f59e0b;
    --danger: #ef4444;
    --layer-static: #8b5cf6;
    --layer-low: #3b82f6;
    --layer-mid: #14b8a6;
    --layer-high: #f59e0b;
    --layer-turn: #64748b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  header .status { font-size: 12px; color: var(--muted); }
  header .status.err { color: var(--danger); }
  button, select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button:hover, select:hover { filter: brightness(1.1); }
  button.primary { background: var(--accent-2); color: #fff; border: none; }
  a { color: var(--accent); text-decoration: none; font-size: 13px; }
  a:hover { text-decoration: underline; }

  main { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }

  .section-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 26px 0 10px; }
  .section-title:first-child { margin-top: 0; }

  /* 概要统计卡 */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .stat .k { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat .v { font-size: 18px; font-weight: 600; }
  .stat .v small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .stat .sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .stat .v.mono { font-family: ui-monospace, Consolas, monospace; font-size: 15px; }

  .badge { display: inline-block; border-radius: 5px; padding: 1px 7px; font-size: 11px; border: 1px solid transparent; }
  .badge.hit { background: rgba(34,197,94,.14); color: var(--ok); border-color: rgba(34,197,94,.4); }
  .badge.miss { background: rgba(239,68,68,.14); color: var(--danger); border-color: rgba(239,68,68,.4); }
  .badge.na { background: var(--panel-2); color: var(--muted); border-color: var(--border); }

  /* 缓存地图条 */
  .map-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .map-wrap { position: relative; }
  .map-bar { display: flex; height: 34px; border-radius: 8px; overflow: hidden; background: var(--panel-2); }
  .map-block { position: relative; min-width: 6px; flex-grow: 1; flex-basis: 0; }
  .map-block.seg { border-right: 1px solid rgba(0,0,0,.35); }
  .map-block.removed { opacity: .35; background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(0,0,0,.35) 4px 8px); }
  .map-block .dot {
    position: absolute; top: 2px; right: 2px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--muted);
  }
  .map-block .dot.same { background: var(--ok); }
  .map-block .dot.changed { background: var(--danger); }
  .map-block .dot.added { background: var(--warn); }
  .map-block .dot.removed { background: var(--muted); }
  .map-overlay { position: absolute; top: 0; bottom: 0; background: rgba(255,255,255,.05); border-right: 1px dashed var(--muted); pointer-events: none; }
  .map-marker { position: absolute; top: 34px; width: 1px; height: 10px; background: var(--muted); }
  .map-marker .tag { position: absolute; top: 10px; left: 0; transform: translateX(-4px); font-size: 10px; color: var(--muted); white-space: nowrap; }
  .map-marker.change { background: var(--warn); }
  .map-marker.change .tag { color: var(--warn); }
  .map-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 18px; font-size: 11.5px; color: var(--muted); }
  .map-legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .map-tags { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .map-tags code { color: var(--text); background: var(--panel-2); border-radius: 4px; padding: 1px 6px; margin-right: 4px; font-size: 11px; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 11px; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.row:hover { background: var(--panel-2); cursor: pointer; }
  td.mono, .mono { font-family: ui-monospace, Consolas, monospace; }
  td.hash { max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  td.num { text-align: right; color: var(--muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .dot.same { background: var(--ok); } .dot.changed { background: var(--danger); }
  .dot.added { background: var(--warn); } .dot.removed { background: var(--muted); }
  .warn-banner { background: #2a2014; border: 1px solid rgba(245,158,11,.4); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 12px; margin-bottom: 10px; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; }
  details.panel summary { cursor: pointer; font-size: 13.5px; padding: 6px 0; user-select: none; }
  details.panel summary .layer-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 8px; vertical-align: -1px; }
  details.panel summary .meta { color: var(--muted); font-size: 12px; float: right; }
  details.panel .body { margin: 6px -4px 8px; }
  .msg-row { border-bottom: 1px solid var(--border); }
  .msg-row summary { cursor: pointer; padding: 8px 6px; font-size: 12.5px; user-select: none; }
  .msg-row pre {
    margin: 0; padding: 10px 12px; background: var(--panel-2); border-radius: 8px;
    white-space: pre-wrap; word-break: break-word; font-size: 12.5px; line-height: 1.6;
    font-family: inherit; max-height: 300px; overflow-y: auto;
  }
  .btn-row { display: flex; gap: 10px; align-items: center; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 8px 2px; }

  /* 详情抽屉 */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 92vw;
    background: var(--panel); border-left: 1px solid var(--border); z-index: 60;
    display: flex; flex-direction: column; transform: translateX(100%); transition: transform .18s ease;
  }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .drawer-head h2 { font-size: 14px; margin: 0; flex: 1; }
  .drawer-head .meta { font-size: 11px; color: var(--muted); }
  .drawer-tabs { display: flex; gap: 4px; padding: 8px 16px 0; }
  .drawer-tabs button { padding: 5px 12px; font-size: 12px; border-radius: 6px 6px 0 0; }
  .drawer-tabs button.active { background: var(--panel-2); border-bottom-color: var(--accent); color: var(--accent); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
  .drawer-body pre {
    margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.65;
    font-family: inherit;
  }
</style>
</head>
<body>
<header>
  <a href="/devtools">← 工具</a>
  <h1>上下文检查器</h1>
  <span class="spacer"></span>
  <span class="status" id="status">连接中…</span>
  <select id="pollSel">
    <option value="0" selected>轮询:关</option>
    <option value="2000">轮询:2s</option>
    <option value="5000">轮询:5s</option>
  </select>
  <button id="refreshBtn">刷新</button>
  <button id="baselineBtn" class="primary">设置基线</button>
</header>

<main>
  <div class="section-title">概要</div>
  <div class="stats" id="stats"></div>

  <div class="section-title">编译布局 · 缓存地图(相对上次查看)</div>
  <div class="map-panel">
    <div class="map-wrap">
      <div class="map-bar" id="mapBar"></div>
      <div id="mapOverlays"></div>
    </div>
    <div id="mapMarkers"></div>
    <div class="map-legend">
      <span><span class="sw" style="background:var(--layer-static)"></span>静态层</span>
      <span><span class="sw" style="background:var(--layer-low)"></span>低频层</span>
      <span><span class="sw" style="background:var(--layer-mid)"></span>中频层</span>
      <span><span class="sw" style="background:var(--layer-high)"></span>高频层</span>
      <span><span class="sw" style="background:var(--layer-turn)"></span>对话轮</span>
      <span><span class="sw" style="background:var(--ok)"></span>未变</span>
      <span><span class="sw" style="background:var(--danger)"></span>已变</span>
      <span><span class="sw" style="background:var(--warn)"></span>新增</span>
      <span><span class="sw" style="background:var(--muted)"></span>移除</span>
    </div>
    <div class="map-tags" id="mapTags"></div>
  </div>

  <div class="section-title">层级</div>
  <div id="layers"></div>

  <div class="section-title">对话缓冲</div>
  <div class="panel" id="conversation"></div>

  <div class="section-title">编译产物(最终模型输入)</div>
  <div class="panel">
    <div class="btn-row">
      <button id="loadMessagesBtn">查看最终模型输入</button>
      <span class="status" id="messagesInfo" style="font-size:12px;color:var(--muted)"></span>
      <span class="spacer" style="flex:1"></span>
      <button id="copyAllBtn" style="display:none">复制全部</button>
    </div>
    <div id="messages"></div>
  </div>
</main>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle"></h2>
    <span class="meta" id="drawerMeta"></span>
    <button id="drawerCopy">复制</button>
    <button id="drawerClose">✕</button>
  </div>
  <div class="drawer-tabs" id="drawerTabs"></div>
  <div class="drawer-body"><pre id="drawerBody"></pre></div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
const STATUS_LABEL = { same: "未变", changed: "已变", added: "新增", removed: "移除" };
const LAYER_COLOR = { STATIC: "var(--layer-static)", LOW: "var(--layer-low)", MID: "var(--layer-mid)", HIGH: "var(--layer-high)" };

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtChars(n) { return n >= 10000 ? (n / 1000).toFixed(1) + "K" : String(n); }
function shortHash(h) { return h ? h.slice(0, 8) : "—"; }
async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.status);
  return data;
}

let currentData = null;
let busy = false;
let pollTimer = null;
let messagesCache = null;

function setStatus(msg, isErr) {
  const el = $("#status");
  el.textContent = msg;
  el.className = "status" + (isErr ? " err" : "");
}

function statusDot(status) {
  return status ? `<span class="dot ${escapeHtml(status)}"></span>${STATUS_LABEL[status] || status}` : '<span style="color:var(--muted)">—</span>';
}

async function refresh() {
  if (busy) return;
  busy = true;
  try {
    currentData = await fetchJSON("/api/devtools/context");
    setStatus("已连接 · " + currentData.captured_at.slice(11, 19));
    renderAll(currentData);
  } catch (e) {
    setStatus("连接失败:" + e.message, true);
  } finally {
    busy = false;
  }
}

function setPoll(ms) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (ms > 0 && !document.hidden) pollTimer = setInterval(refresh, ms);
}
$("#pollSel").addEventListener("change", (e) => setPoll(Number(e.target.value)));
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) setPoll(Number($("#pollSel").value));
  else if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
});

// ---- 渲染 ----
function renderAll(d) {
  renderStats(d);
  renderMap(d);
  renderLayers(d);
  renderConversation(d);
  $("#baselineBtn").textContent = d.baseline_set ? "清除基线" : "设置基线";
  $("#baselineBtn").className = d.baseline_set ? "" : "primary";
}

function hitBadge(hit, sub) {
  if (hit == null) return `<span class="badge na">暂无</span>`;
  return `<span class="badge ${hit ? "hit" : "miss"}">${hit ? "✓ 命中" : "✗ 未命中"}</span><div class="sub">${escapeHtml(sub || "")}</div>`;
}

function renderStats(d) {
  const s = d.current.summary;
  const vp = d.vs_previous, vb = d.vs_baseline;
  const cards = [
    { k: "段数", v: s.total_segments },
    { k: "段字符", v: fmtChars(s.segment_chars) },
    { k: "编译消息数", v: s.message_count },
    { k: "对话轮数", v: s.conversation_turns, sub: `max ${s.conversation_max_turns}` },
    { k: "前缀字符", v: fmtChars(s.prefix_chars) },
    { k: "前缀 hash", v: shortHash(s.prefix_hash), mono: true },
    { k: "缓存命中 · 上次", html: hitBadge(vp.prefix_cache_hit ?? null, vp.reason ? "尚未有上次快照" : (vp.prefix_break_reason === "ok" ? "" : vp.prefix_break_reason)) },
    { k: "缓存命中 · 基线", html: hitBadge(vb.prefix_cache_hit ?? null, vb.reason ? "未设置基线" : (vb.prefix_break_reason === "ok" ? "" : vb.prefix_break_reason)) },
  ];
  $("#stats").innerHTML = cards.map((c) => `
    <div class="stat">
      <div class="k">${escapeHtml(c.k)}</div>
      ${c.html ? c.html : `<div class="v${c.mono ? " mono" : ""}">${escapeHtml(String(c.v))}${c.sub ? ` <small>${escapeHtml(c.sub)}</small>` : ""}</div>`}
    </div>`).join("");
}

function renderMap(d) {
  const units = (d.vs_previous.units || d.current.layout_units.map((u) => ({ ...u, status: null })));
  const total = units.reduce((sum, u) => sum + u.length, 0) || 1;

  // 标记位置(合并空间累计长度)
  let prefixEnd = null, msg0End = null, firstChange = null, cum = 0;
  units.forEach((u, i) => {
    if (u.in_prefix && u.status !== "removed") prefixEnd = cum + u.length;
    if (u.merged && u.status !== "removed") msg0End = cum + u.length;
    if (u.status && u.status !== "same" && firstChange == null) firstChange = cum;
    cum += u.length;
  });

  const bar = $("#mapBar");
  bar.innerHTML = units.map((u) => {
    const color = u.status === "removed" ? "var(--muted)" : (LAYER_COLOR[u.layer] || "var(--layer-turn)");
    const dot = u.status ? `<span class="dot ${escapeHtml(u.status)}"></span>` : "";
    const click = u.status !== "removed" ? ` data-key="${escapeHtml(u.key)}" data-kind="${escapeHtml(u.kind)}" data-index="${u.index ?? ""}"` : "";
    return `<div class="map-block seg ${u.status === "removed" ? "removed" : ""}" style="flex-grow:${Math.max(6, u.length)};background:${color}" title="${escapeHtml(u.key)} · ${u.status ? STATUS_LABEL[u.status] : "—"} · ${fmtChars(u.length)} 字符 · ${shortHash(u.hash)}"${click}>${dot}</div>`;
  }).join("");

  const overlays = [];
  if (prefixEnd != null) overlays.push(`<div class="map-overlay" style="left:0;width:${prefixEnd / total * 100}%" title="缓存前缀区"></div>`);
  const markers = [];
  if (prefixEnd != null) markers.push(`<div class="map-marker" style="left:${prefixEnd / total * 100}%"><span class="tag">前缀区终点</span></div>`);
  if (msg0End != null && msg0End !== prefixEnd) markers.push(`<div class="map-marker" style="left:${msg0End / total * 100}%"><span class="tag">message[0] 终点</span></div>`);
  if (firstChange != null) markers.push(`<div class="map-marker change" style="left:${firstChange / total * 100}%"><span class="tag">首次变化</span></div>`);
  $("#mapOverlays").innerHTML = overlays.join("");
  $("#mapMarkers").innerHTML = markers.join("");

  const ci = d.current.summary.cache_info;
  $("#mapTags").innerHTML =
    `<span>前缀区(prefix):</span>` + (ci.prefix_segments.length ? ci.prefix_segments.map((t) => `<code>${escapeHtml(t)}</code>`).join("") : '<span style="color:var(--muted)">空</span>') +
    `<span style="margin-left:14px">动态区(dynamic):</span>` + (ci.dynamic_segments.length ? ci.dynamic_segments.map((t) => `<code>${escapeHtml(t)}</code>`).join("") : '<span style="color:var(--muted)">空</span>');

  bar.querySelectorAll(".map-block[data-kind]").forEach((el) => {
    el.style.cursor = "pointer";
    el.addEventListener("click", () => {
      if (el.dataset.kind === "segment") openSegment(el.dataset.key);
      else openTurn(Number(el.dataset.index));
    });
  });
}

function unitStatusMaps(diffObj) {
  const byKey = {};
  const byTurnIndex = {};
  if (!diffObj || !diffObj.units) return { byKey, byTurnIndex };
  for (const u of diffObj.units) {
    if (u.kind === "segment") byKey[u.key] = u.status;
    else if (u.status !== "removed") byTurnIndex[u.index] = u.status;
  }
  return { byKey, byTurnIndex };
}

function renderLayers(d) {
  const p = unitStatusMaps(d.vs_previous);
  const b = unitStatusMaps(d.vs_baseline);
  $("#layers").innerHTML = d.current.layers.map((layer) => {
    const rows = layer.segments.length
      ? layer.segments.map((s) => `
        <tr class="row" data-kind="segment" data-key="${escapeHtml(s.tag)}">
          <td class="mono">${escapeHtml(s.tag)}</td>
          <td>${escapeHtml(s.role)}</td>
          <td>${s.cacheable ? "✓" : (s.in_prefix ? "✗ ⚠" : "✗")}</td>
          <td class="num">${fmtChars(s.length)}</td>
          <td class="mono hash">${shortHash(s.hash)}</td>
          <td>${statusDot(p.byKey[s.tag])}</td>
          <td>${statusDot(b.byKey[s.tag])}</td>
        </tr>`).join("")
      : `<tr><td colspan="7" class="empty">该层暂无片段</td></tr>`;
    return `
      <details class="panel" open>
        <summary>
          <span class="layer-dot" style="background:${LAYER_COLOR[layer.layer]}"></span>
          <b>${escapeHtml(layer.label)}</b>
          <span class="meta">${layer.count} 段 · ${fmtChars(layer.chars)} 字符</span>
        </summary>
        <div class="body"><table>
          <tr><th>tag</th><th>role</th><th>cacheable</th><th style="text-align:right">长度</th><th>hash</th><th>上次</th><th>基线</th></tr>
          ${rows}
        </table></div>
      </details>`;
  }).join("");
  document.querySelectorAll("#layers tr.row").forEach((el) => {
    el.addEventListener("click", () => openSegment(el.dataset.key));
  });
}

function renderConversation(d) {
  const el = $("#conversation");
  const conv = d.current.conversation;
  const vp = d.vs_previous;
  const { byTurnIndex } = unitStatusMaps(vp);
  let html = "";
  const convStatus = vp && vp.conversation ? vp.conversation.status : null;
  if (convStatus === "truncated" || convStatus === "replaced") {
    html += `<div class="warn-banner">⚠ 对话队列发生截断:旧轮被 max_turns 驱逐(移除 ${vp.conversation.removed} 轮,新增 ${vp.conversation.added} 轮)。被移除的旧轮已不在当前上下文中。</div>`;
  }
  if (!conv.turns.length) {
    html += '<div class="empty">对话缓冲为空(尚未对话,或已清空)。</div>';
  } else {
    const turns = [...conv.turns].reverse(); // 最新在前
    html += `<table>
      <tr><th>索引</th><th>role</th><th style="text-align:right">长度</th><th>hash</th><th>上次</th><th>基线</th></tr>` +
      turns.map((t) => `
        <tr class="row" data-kind="turn" data-index="${t.index}">
          <td class="mono">turn:${t.index}</td>
          <td>${escapeHtml(t.role)}</td>
          <td class="num">${fmtChars(t.length)}</td>
          <td class="mono hash">${shortHash(t.hash)}</td>
          <td>${statusDot(byTurnIndex[t.index])}</td>
          <td>${statusDot(unitStatusMaps(d.vs_baseline).byTurnIndex[t.index])}</td>
        </tr>`).join("") +
      "</table>";
  }
  el.innerHTML = html;
  el.querySelectorAll("tr.row").forEach((row) => {
    row.addEventListener("click", () => openTurn(Number(row.dataset.index)));
  });
}

// ---- 编译产物 ----
$("#loadMessagesBtn").addEventListener("click", async () => {
  try {
    messagesCache = await fetchJSON("/api/devtools/context/messages");
    renderMessages();
  } catch (e) {
    $("#messagesInfo").textContent = "加载失败:" + e.message;
  }
});
$("#copyAllBtn").addEventListener("click", () => {
  const text = messagesCache.messages.map((m) => `[${m.role}]\n${m.content}`).join("\n\n");
  copyText(text);
});

function renderMessages() {
  const m = messagesCache;
  $("#messagesInfo").textContent = `${m.count} 条 · ${fmtChars(m.total_chars)} 字符` + (m.notes.length ? " · " + m.notes[0] : "");
  $("#copyAllBtn").style.display = "";
  $("#messages").innerHTML = m.messages.map((msg) => `
    <details class="msg-row">
      <summary><b>#${msg.index}</b> <span class="mono">${escapeHtml(msg.role)}</span> · ${fmtChars(msg.chars)} 字符</summary>
      <pre>${escapeHtml(msg.content)}</pre>
    </details>`).join("");
}

// ---- 详情抽屉 ----
let drawerState = null;

async function openSegment(tag) {
  try {
    const p = await fetchJSON("/api/devtools/context/segment/" + encodeURIComponent(tag) + "?against=previous");
    const b = await fetchJSON("/api/devtools/context/segment/" + encodeURIComponent(tag) + "?against=baseline");
    drawerState = {
      title: tag,
      meta: `${p.label} · ${p.role} · ${fmtChars(p.length)} 字符`,
      texts: { "当前": p.current_text },
    };
    if (p.previous_text != null) drawerState.texts["上次"] = p.previous_text;
    if (b.previous_text != null && b.previous_text !== p.previous_text) drawerState.texts["基线"] = b.previous_text;
    showDrawer(drawerState, "当前");
  } catch (e) {
    setStatus("读取 segment 失败:" + e.message, true);
  }
}

async function openTurn(index) {
  try {
    const t = await fetchJSON("/api/devtools/context/turn/" + index);
    drawerState = {
      title: `turn:${t.index}`,
      meta: `${t.role} · ${fmtChars(t.length)} 字符`,
      texts: { "内容": t.text },
    };
    showDrawer(drawerState, "内容");
  } catch (e) {
    setStatus("读取 turn 失败:" + e.message, true);
  }
}

function showDrawer(state, activeTab) {
  const tabs = Object.keys(state.texts);
  $("#drawerTitle").textContent = state.title;
  $("#drawerMeta").textContent = state.meta;
  $("#drawerTabs").innerHTML = tabs.length > 1
    ? tabs.map((t) => `<button data-tab="${escapeHtml(t)}" class="${t === activeTab ? "active" : ""}">${escapeHtml(t)}</button>`).join("")
    : "";
  $("#drawerBody").textContent = state.texts[activeTab] ?? "";
  $("#drawer").classList.add("open");
  $("#drawerTabs").querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      $("#drawerTabs").querySelectorAll("button").forEach((x) => x.classList.remove("active"));
      btn.classList.add("active");
      $("#drawerBody").textContent = state.texts[btn.dataset.tab];
    });
  });
}

function closeDrawer() {
  $("#drawer").classList.remove("open");
  drawerState = null;
}
$("#drawerClose").addEventListener("click", closeDrawer);
$("#drawerCopy").addEventListener("click", () => copyText($("#drawerBody").textContent));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    setStatus("已复制");
  } catch (e) {
    setStatus("复制失败:" + e.message, true);
  }
}

// ---- 基线与刷新 ----
$("#refreshBtn").addEventListener("click", refresh);
$("#baselineBtn").addEventListener("click", async () => {
  try {
    if (currentData && currentData.baseline_set) {
      await fetchJSON("/api/devtools/context/baseline", { method: "DELETE" });
    } else {
      await fetchJSON("/api/devtools/context/baseline", { method: "POST" });
    }
    await refresh();
  } catch (e) {
    setStatus("基线操作失败:" + e.message, true);
  }
});

refresh();
</script>
</body>
</html>
